<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122B49"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PVÖL"><link rel="manifest" href="./manifest.webmanifest"><title>PVÖL Förråd</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#122b49;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}header{background:#122b49;color:#fff;padding:23px 18px 17px}header strong{font-size:26px}header p{color:#f5c842;margin:4px 0 0;font-size:13px}.wrap{max-width:720px;margin:auto;padding:18px 14px 95px}h2{font-size:21px;margin:4px 0 16px}h3{margin:4px 0 10px;font-size:17px}.card{background:white;border:1px solid #e1e6ec;border-radius:15px;padding:18px;margin:0 0 13px;box-shadow:0 2px 6px #122b4909}.muted{color:#657183;font-size:13px}.flex{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{background:#e7f4e9;color:#20703a;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700}.tag.off{background:#ffebeb;color:#b02727}button{background:#122b49;color:white;border:0;border-radius:9px;padding:11px 14px;font-size:14px;cursor:pointer}button.secondary{background:#edf1f5;color:#122b49}button.danger{background:#b22e2e}input,textarea,select{display:block;width:100%;padding:12px;border:1px solid #cbd4df;border-radius:9px;font:inherit;margin:7px 0 12px}label{font-size:13px;font-weight:650}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:white;border-top:1px solid #dbe0e8;padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;max-width:180px;border-radius:0;background:white;color:#526176;padding:13px 3px;font-size:12px}nav button.active{border-top:3px solid #f5c842;color:#122b49;font-weight:750}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.error{color:#a22}.notice{border-left:4px solid #f5c842;padding-left:12px}.pill{display:inline-block;padding:5px 10px;border-radius:14px;background:#f3f5f8;margin:3px;font-size:12px}
</style></head><body><header><strong>🚛 PVÖL Förråd</strong><p>Information · Personal · Arbete</p></header><main class="wrap"><section id="login" class="card"><h2>Välkommen!</h2><p>Logga in med din inbjudna e-postadress. Både jobbmejl och privat mejl fungerar om administratören har godkänt kontot.</p><label for="email">E-postadress</label><input id="email" type="email" autocomplete="email" placeholder="namn@exempel.se"><button id="send">Skicka inloggningslänk</button><p id="loginMessage" class="muted"></p></section><section id="app" class="hidden"><div id="content"></div></section><p id="error" class="error"></p></main><nav id="nav" class="hidden"><button data-tab="home" class="active">Hem</button><button data-tab="calendar">Kalender</button><button data-tab="attendance">Närvaro</button><button data-tab="instructions">Instruktioner</button></nav><script>
const BASE='https://usximvurnararrwsnbit.supabase.co',KEY='sb_publishable_SI8yLXOZL_XXSmm8F7Xvnw_YoJcB-Yh';let session=null,member=null,tab='home',weekOffset=0,changes={};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function authFetch(path,options={}){const res=await fetch(BASE+'/auth/v1/'+path,{...options,headers:{apikey:KEY,'Content-Type':'application/json',...(options.headers||{})}});if(!res.ok)throw Error(await res.text());return res.json()}
async function api(path,options={}){const res=await fetch(BASE+'/rest/v1/'+path,{...options,headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(options.headers||{})}});if(!res.ok)throw Error(await res.text());return res.status===204?null:res.text().then(t=>t?JSON.parse(t):null)}
async function ensureSession(){if(!session)return false;const expiry=session.expires_at||0;if(Date.now()/1000<expiry-90)return true;if(!session.refresh_token)return false;const refreshed=await authFetch('token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})});session={...refreshed,expires_at:Math.floor(Date.now()/1000)+refreshed.expires_in};localStorage.setItem('pvol_session',JSON.stringify(session));return true}
function monday(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()-(x.getUTCDay()||7)+1);return x}function iso(d){return d.toISOString().slice(0,10)}function weekNo(d){const x=new Date(d);x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil(((x-y)/86400000+1)/7)}
function meetings(){const d=monday(new Date());d.setUTCDate(d.getUTCDate()+weekOffset*7);const w=weekNo(d);const items=[{shift:0,day:'Måndag',type:'morgon',title:'Morgonmöte',time:'08.20–08.25',location:'Matsalen'},w%2?{shift:2,day:'Onsdag',type:'avdelning',title:'Avdelningsmöte',time:'07.15–08.00',location:'Ej angiven'}:{shift:3,day:'Torsdag',type:'morgon',title:'Morgonmöte',time:'08.20–08.25',location:'Matsalen'}];return {week:w,year:d.getUTCFullYear(),items:items.map(x=>{const date=new Date(d);date.setUTCDate(date.getUTCDate()+x.shift);return {...x,date:iso(date),id:iso(date)+'_'+x.type}})}}
function render(){const root=$('content');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home'){root.innerHTML='<h2>Hej '+esc(member.display_name||'kollega')+'! 👋</h2><div class="card"><h3>Information</h3><p>Välkommen till PVÖL Förråd.</p><p class="muted">Nyhetsflöde med inlägg, bilder och kommentarer kommer i en senare version.</p></div><div class="card notice"><h3>Möten och närvaro</h3><p>Se veckans möten i kalendern och registrera din egen närvaro.</p><button onclick="go(\'calendar\')">Visa möten</button></div>'}else if(tab==='calendar'){const m=meetings();root.innerHTML='<div class="flex"><button class="secondary" onclick="move(-1)">‹</button><h2>Vecka '+m.week+' · '+m.year+'</h2><button class="secondary" onclick="move(1)">›</button></div>'+m.items.map(x=>{const c=changes[x.id]||{},admin=['admin','owner'].includes(member.role);return '<div class="card"><div class="flex"><div><span class="muted">'+x.day+' '+x.date+'</span><h3>'+x.title+'</h3></div><span class="tag '+(c.cancelled?'off':'')+'">'+(c.cancelled?'INSTÄLLT':'Planerat')+'</span></div><p>🕒 '+x.time+'</p><p>📍 '+esc(c.location||x.location)+'</p>'+(c.cancellation_reason?'<p class="muted">Orsak: '+esc(c.cancellation_reason)+'</p>':'')+(admin?'<div class="row"><button class="secondary" onclick="changeRoom(\''+x.date+'\',\''+x.type+'\')">Ändra lokal</button><button class="'+(c.cancelled?'secondary':'danger')+'" onclick="cancelMeeting(\''+x.date+'\',\''+x.type+'\','+!!c.cancelled+')">'+(c.cancelled?'Återställ':'Ställ in')+'</button></div>':'')+'</div>'}).join('')}else if(tab==='attendance'){root.innerHTML='<h2>Min närvaro</h2><div class="card"><label>Från datum<input type="date" id="from"></label><label>Till datum<input type="date" id="to"></label><label>Status<select id="status">'+['Jobbar','Ledig','Sjuk','VAB','Facklig','Möte','Annat'].map(s=>'<option>'+s+'</option>').join('')+'</select></label><label>Privat anteckning<textarea id="note" placeholder="Valfritt"></textarea></label><button onclick="saveAttendance()">Spara</button><p class="muted">Bara du kan se dina registreringar.</p></div><div id="attendanceList"></div>';loadAttendance()}else{root.innerHTML='<h2>Arbetsinstruktioner</h2><div class="card"><p>Sökbara instruktioner och bilagor kommer att publiceras här av administratörer.</p><div>'+['Truckar','Plock','Moppe','Utkör','Avrop','Luckan','Brist','Däck'].map(x=>'<span class="pill">'+x+'</span>').join('')+'</div></div>'}}
window.go=t=>{tab=t;render()};window.move=async n=>{weekOffset+=n;await loadChanges()};async function loadChanges(){try{await ensureSession();const rows=await api('pvol_meeting_changes?select=*');changes=Object.fromEntries(rows.map(r=>[r.meeting_date+'_'+r.meeting_type,r]));render()}catch(e){$('error').textContent='Kalendern kunde inte uppdateras: '+e.message}}
async function saveChange(date,type,patch){try{await ensureSession();const previous=changes[date+'_'+type]||{};await api('pvol_meeting_changes?on_conflict=meeting_date,meeting_type',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({meeting_date:date,meeting_type:type,location:previous.location||null,cancelled:previous.cancelled||false,cancellation_reason:previous.cancellation_reason||null,...patch,updated_by:session.user.id})});await loadChanges()}catch(e){alert('Kunde inte spara: '+e.message)}}
window.changeRoom=(date,type)=>{const p=prompt('Ange lokal',changes[date+'_'+type]?.location||(type==='morgon'?'Matsalen':''));if(p!==null&&p.trim())saveChange(date,type,{location:p.trim()})};window.cancelMeeting=(date,type,already)=>{if(already){if(confirm('Återställ mötet?'))saveChange(date,type,{cancelled:false,cancellation_reason:null})}else if(confirm('Ställ in detta möte?'))saveChange(date,type,{cancelled:true,cancellation_reason:prompt('Orsak (valfri)')||null})};
window.saveAttendance=async()=>{const start=$('from').value,end=$('to').value;if(!start||!end||start>end)return alert('Ange giltiga datum');try{await ensureSession();await api('pvol_attendance',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:session.user.id,start_date:start,end_date:end,status:$('status').value,note:$('note').value})});await loadAttendance()}catch(e){alert('Kunde inte spara: '+e.message)}};
async function loadAttendance(){try{await ensureSession();const rows=await api('pvol_attendance?select=*&order=start_date.desc&limit=40');$('attendanceList').innerHTML=rows.length?rows.map(r=>'<div class="card"><b>'+esc(r.status)+'</b><p>'+esc(r.start_date)+' till '+esc(r.end_date)+'</p><p class="muted">'+esc(r.note)+'</p></div>').join(''):'<p class="muted">Inga registreringar ännu.</p>'}catch(e){$('attendanceList').textContent=e.message}}
async function start(s){session=s;await ensureSession();const user=await fetch(BASE+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+session.access_token}});if(!user.ok)throw Error('Sessionen är ogiltig');session.user=await user.json();localStorage.setItem('pvol_session',JSON.stringify(session));const rows=await api('pvol_members?select=*&user_id=eq.'+session.user.id);if(!rows.length){$('loginMessage').textContent='Du är inloggad, men ännu inte inbjuden till PVÖL. Kontakta administratören.';return}member=rows[0];$('login').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden');await loadChanges()}
$('send').onclick=async()=>{const email=$('email').value.trim();if(!email)return;$('loginMessage').textContent='Skickar…';try{await authFetch('otp',{method:'POST',body:JSON.stringify({email,create_user:false,email_redirect_to:location.origin+location.pathname})});$('loginMessage').textContent='Om adressen är inbjuden får du snart en inloggningslänk.'}catch(e){$('loginMessage').textContent='Det gick inte att skicka länken: '+e.message}};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));(async()=>{try{const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('access_token')){await start({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token'),expires_at:Math.floor(Date.now()/1000)+Number(hash.get('expires_in')||3600)});history.replaceState(null,'',location.pathname)}else{const s=JSON.parse(localStorage.getItem('pvol_session')||'null');if(s)await start(s)}}catch(e){$('error').textContent='Inloggning misslyckades: '+e.message;localStorage.removeItem('pvol_session')}})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&member)loadChanges()});
</script></body></html>
